name: "CI"

on:
  workflow_dispatch:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    name: "cargo check and test"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Rust"
        uses: dtolnay/rust-toolchain@stable

      - name: "Cache cargo"
        uses: Swatinem/rust-cache@v2

      - name: "cargo check"
        run: "cargo check --all-targets"

      - name: "cargo test"
        run: "cargo test --lib"
